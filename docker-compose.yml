services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: typst-drag-drop-builder:latest
    container_name: typst_builder_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/data/typst-builder.db
    volumes:
      - ./data:/data
      - ./uploads:/app/public/uploads
