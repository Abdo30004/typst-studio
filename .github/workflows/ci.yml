name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Typecheck, Test & Next.js Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Typst CLI 0.12.0
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Build Next.js Production Application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./prod.db"

  docker-build:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: typst-studio:latest
